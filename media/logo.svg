<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a22"/>
      <stop offset="1" stop-color="#0a100c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a3"/>
      <stop offset="0.5" stop-color="#e0b040"/>
      <stop offset="1" stop-color="#9a6410"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9d8a6"/>
      <stop offset="1" stop-color="#bfa265"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0b040" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#e0b040" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="240" fill="url(#glow)"/>

  <!-- Gefaltete Karte -->
  <g transform="translate(256 262)">
    <path d="M-170 -120 L-60 -150 L60 -120 L170 -150 L170 130 L60 160 L-60 130 L-170 160 Z" fill="#3a2a10"/>
    <path d="M-160 -112 L-60 -140 L-60 122 L-160 150 Z" fill="url(#paper)"/>
    <path d="M-60 -140 L60 -112 L60 150 L-60 122 Z" fill="#d9c58f"/>
    <path d="M60 -112 L160 -140 L160 122 L60 150 Z" fill="url(#paper)"/>
    <!-- Gebiete -->
    <path d="M-140 -60 C-110 -90 -80 -70 -75 -40 C-70 -10 -110 0 -135 -15 Z" fill="#6fae5a" opacity="0.85"/>
    <path d="M-40 -40 C-10 -70 30 -50 35 -20 C40 20 0 35 -30 20 C-50 5 -55 -20 -40 -40 Z" fill="#e8a33a" opacity="0.85"/>
    <path d="M80 10 C110 -15 145 0 140 35 C135 70 95 75 80 50 Z" fill="#c8483c" opacity="0.85"/>
    <!-- Route -->
    <path d="M-110 -35 C-70 10 -40 -10 -5 -10 C30 -10 60 40 105 35" fill="none" stroke="#5a3a10" stroke-width="7" stroke-dasharray="14 11" stroke-linecap="round"/>
    <circle cx="105" cy="35" r="11" fill="#5a3a10"/>
  </g>

  <!-- Ähre (Drescher) -->
  <g transform="translate(372 330) rotate(18)">
    <path d="M0 150 L0 -40" stroke="url(#gold)" stroke-width="9" stroke-linecap="round"/>
    <g fill="url(#gold)" stroke="#2a1a05" stroke-width="3">
      <ellipse cx="-17" cy="-50" rx="13" ry="26" transform="rotate(-25 -17 -50)"/>
      <ellipse cx="17" cy="-50" rx="13" ry="26" transform="rotate(25 17 -50)"/>
      <ellipse cx="-17" cy="-5" rx="13" ry="26" transform="rotate(-25 -17 -5)"/>
      <ellipse cx="17" cy="-5" rx="13" ry="26" transform="rotate(25 17 -5)"/>
      <ellipse cx="-17" cy="40" rx="13" ry="26" transform="rotate(-25 -17 40)"/>
      <ellipse cx="17" cy="40" rx="13" ry="26" transform="rotate(25 17 40)"/>
      <ellipse cx="0" cy="-88" rx="12" ry="26"/>
    </g>
  </g>

  <!-- Kompassnadel -->
  <g transform="translate(150 140)">
    <circle r="62" fill="#14110a" stroke="url(#gold)" stroke-width="8"/>
    <path d="M0 -48 L13 0 L0 48 L-13 0 Z" fill="url(#gold)"/>
    <path d="M0 -48 L13 0 L0 0 Z" fill="#fff3c4"/>
    <circle r="7" fill="#14110a" stroke="url(#gold)" stroke-width="3"/>
  </g>
</svg>
